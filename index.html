<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e56e8">
  <meta name="description" content="Needly — พื้นที่เล็ก ๆ ที่เชื่อมความต้องการกับความช่วยเหลือในชุมชน">
  <title>Needly — ส่งต่อความช่วยเหลือ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="เมนูหลัก">
      <a class="brand" href="#/home" aria-label="Needly หน้าแรก">
        <span class="brand-mark">n<span class="brand-heart">♥</span></span>
        <span class="brand-type">needly<small>little needs, big kindness</small></span>
      </a>
      <div class="side-heading">MENU</div>
      <nav id="sideNav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="side-note"><span class="note-emoji">💌</span><strong>ทุกความช่วยเหลือ<br>เริ่มต้นจากการมองเห็น</strong><p>โพสต์สิ่งที่ต้องการ หรือแบ่งปันสิ่งที่คุณมี</p><button class="btn btn-light full" data-route="/create">+ สร้างโพสต์ใหม่</button></div>
        <span class="version">Needly Mini Project · Demo v1.0</span>
      </div>
    </aside>
    <div class="app-body">
      <header class="topbar">
        <a class="mobile-brand" href="#/home"><span class="brand-mark">n<span class="brand-heart">♥</span></span><strong>needly</strong></a>
        <div class="crumbs" id="breadcrumbs"></div>
        <div class="top-actions">
          <button id="topSearch" class="top-search" data-route="/explore" aria-label="ค้นหาโพสต์"><span>⌕</span> <span class="top-search-label">ค้นหาสิ่งที่ต้องการ...</span><kbd>⌘ K</kbd></button>
          <button class="btn btn-primary desktop-add" data-route="/create">＋ สร้างโพสต์</button>
          <button class="avatar-button" id="accountButton" data-route="/login" aria-label="บัญชีผู้ใช้">☺</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="site-footer">Made with ♡ for a kinder community · <span>Needly — โครงงานต้นแบบ IS401101</span></footer>
    </div>
    <nav id="mobileNav" class="mobile-nav" aria-label="เมนูมือถือ"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
